{% extends "base.html" %}
{% load static %}

{% block page_title %}{{ game.name }}{% endblock %}

{% block head %}
  <meta name="csrf-token" content="{{ csrf_token }}">
{% endblock %}

{% block content %}
<div id="gameNetwork" data-game-pk="{{ game.pk }}" width=100% style="aspect-ratio:16/9; border:1px solid #DDDDDD">
  <div class="vis-network" tabindex="0" style="position: relative; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); width: 100%; height: 100%;"><canvas width="100%" style="position: relative; touch-action: none; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); width: 100%; height: 100%;" height="100%"></canvas><div class="vis-manipulation" style="display: block;"><button class="vis-button vis-add" style="touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0);"><div class="vis-label">Add Node</div></button><div class="vis-separator-line"></div><button class="vis-button vis-connect" style="touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0);"><div class="vis-label">Add Edge</div></button></div><div class="vis-edit-mode" style="display: block;"></div><button class="vis-close" aria-label="Close" style="display: block; touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0);"></button></div>
  <div class="vis-edit-mode" style="display: block;"><button class="vis-button vis-edit vis-edit-mode" style="touch-action: pan-y; user-select: none; -webkit-user-drag: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0);"><div class="vis-label">Edit</div></button></div>
</div>
{% endblock %}


{% block footer %}
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script type="module" src="{% static 'js/game_network_logic/game_network.js' %}"></script>

{% endblock %}
