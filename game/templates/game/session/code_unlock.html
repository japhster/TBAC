{% extends "game/session/base.html" %}


{% block window %}
  <div class="container">
    <table class="table table-fixed">
      <form method="POST">
        {% csrf_token %}
        <tr>
          <th>Enter Code:</th>
            <td>{{ form.code }} {{ form.code.errors.as_text }}</td>
        </tr>
        <tr>
          <th colspan=2 class="text-center">
            <button type="submit" class="btn btn-primary">Enter</button>
          </th>
        <tr>
      </form>
    </table>
  </div>
{% endblock %}
