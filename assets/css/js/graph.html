<html>
  <head></head>
  <body>
    <div id="container" style="width:800px;height:600px"></div>
  </body>

  <!-- Load Cytoscape First -->
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

  <!-- Load Edgehandles Second -->
  <script src="https://unpkg.com/cytoscape-edgehandles@4.0.1/dist/cytoscape-edgehandles.min.js"></script>

  <script type="text/javascript">
    cytoscape('edgehandles', Promise.resolve(window.cytoscapeEdgehandles));

    const cy = cytoscape({
      container: document.getElementById('container'),
      style: [
        {
          selector: 'node',
          style: { 'label': 'data(id)', 'background-color': '#0074D9', 'color': '#fff' }
        },
        {
          selector: '.eh-handle', // The little handle you grab to drag an edge
          style: { 'background-color': 'red', 'width': 10, 'height': 10, 'shape': 'ellipse' }
        }
      ],
      elements: [] 
    });

    // --- 1. Drag to Connect Logic ---
    // let eh = cy.edgehandles({
    //   canConnect: (source, target) => !source.same(target), // No self-loops
    //   edgeParams: (source, target) => ({ data: { source: source.id(), target: target.id() } })
    // });

    // --- 2. Click Empty Space to Add Node ---
    cy.on('tap', (event) => {
      // Check if the click was on the background (the "core"), not a node
      if (event.target === cy) {
        const pos = event.position;
        const newId = `n${cy.nodes().length + 1}`;

        cy.add({
          group: 'nodes',
          data: { id: newId },
          position: { x: pos.x, y: pos.y }
        });
        
        console.log(`Node ${newId} created at`, pos);
      }
    });
  </script>
